spring.application.name=shuttle-waitlist
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:h2:file:./data/shuttle;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null

spring.cache.type=caffeine
spring.cache.cache-names=tripAvailability
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10s

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}
logging.pattern.level=%5p [rid=%X{requestId:-}] [user=%X{user:-}]

app.jwt.secret=change-me-in-prod-this-is-a-dev-only-secret-0123456789
app.jwt.expiration-minutes=120
app.booking.max-group-size=10
app.booking.max-skips-before-reservation=3
app.notifications.max-attempts=5
app.notifications.retry-interval-ms=15000
app.reclaim.interval-ms=10000
app.reconcile.interval-ms=60000
app.backup.enabled=true
app.backup.directory=./backups
app.backup.interval-ms=3600000
app.seed.enabled=true
app.sms.failure-probability=0.0
app.scheduling.enabled=true
